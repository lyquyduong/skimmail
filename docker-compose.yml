# SkimMail — end-user Docker Compose. Pulls prebuilt images from GHCR; no
# source or build step needed. This file is published with every release at:
#   https://lyquyduong.github.io/skimmail/docker-compose.yml
#   (also attached to each GitHub Release)
#
# Quick start:
#   curl -fsSLO https://lyquyduong.github.io/skimmail/docker-compose.yml
#   docker compose up -d                        # SkimMail       → http://localhost:8080
#   docker compose --profile wireguard up -d    # SkimMailWG     → http://localhost:8082
#
# Pick ONE edition (they're the same app):
#   • skimmail     — lean default
#   • skimmail-wg  — adds embedded userspace WireGuard egress (§21). Only needed
#     for in-app ("embedded") tunnels; OS-mode WireGuard (bind to a host wg
#     interface) works in the plain edition too.
#
# Pin a version instead of latest:  SKIMMAIL_VERSION=v1.0.0 docker compose up -d
#
# First visit sets your master passphrase. Data lives in the named volume.
# Health: the image is distroless (no shell), so check from the host:
#   curl http://localhost:8080/healthz
name: skimmail

services:
  skimmail:
    image: ghcr.io/lyquyduong/skimmail:${SKIMMAIL_VERSION:-latest}
    ports:
      - "8080:8080"
    environment:
      AUTH_MODE: passphrase
      BASE_URL: http://localhost:8080   # set to your public URL behind a reverse proxy
      DATA_DIR: /data
    volumes:
      - skimmail-data:/data
    restart: unless-stopped

  # SkimMailWG — embedded WireGuard egress edition. `--profile wireguard`.
  skimmail-wg:
    profiles: ["wireguard"]
    image: ghcr.io/lyquyduong/skimmail-wg:${SKIMMAIL_VERSION:-latest}
    ports:
      - "8082:8080"
    environment:
      AUTH_MODE: passphrase
      BASE_URL: http://localhost:8082
      DATA_DIR: /data
    volumes:
      - skimmail-wg-data:/data
    restart: unless-stopped

volumes:
  skimmail-data:
  skimmail-wg-data:
